version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: vercel-clone-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: vercel_clone
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - vercel-clone-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Express (Web Admin Interface - Optional)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: vercel-clone-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - vercel-clone-network

  # Backend API (Optional - for full docker setup)
  # backend:
  #   build: 
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: vercel-clone-backend
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: development
  #     MONGODB_URI: mongodb://admin:password123@mongodb:27017/vercel_clone?authSource=admin
  #     PORT: 5000
  #   ports:
  #     - "5000:5000"
  #   depends_on:
  #     - mongodb
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #   networks:
  #     - vercel-clone-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  vercel-clone-network:
    driver: bridge
