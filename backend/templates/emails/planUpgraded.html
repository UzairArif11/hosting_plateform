<div style="font-family: 'Segoe UI', Arial, sans-serif; max-width: 600px; margin: 0 auto; background: #0f0f23; color: #e5e7eb; border-radius: 16px; overflow: hidden;">
  <div style="background: linear-gradient(135deg, #7c3aed, #6d28d9); padding: 32px; text-align: center;">
    <h1 style="margin: 0; font-size: 24px; color: white;">{{platformName}}</h1>
  </div>
  <div style="padding: 32px;">
    <div style="background: #1e1b4b; border-left: 4px solid #8b5cf6; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
      <h2 style="margin: 0 0 8px 0; color: #8b5cf6; font-size: 20px;">🚀 Plan Upgraded!</h2>
    </div>
    <p style="color: #d1d5db; line-height: 1.6;">Hi <strong style="color: white;">{{userName}}</strong>,</p>
    <p style="color: #d1d5db; line-height: 1.6;">Congratulations! Your plan has been upgraded to <strong style="color: #a78bfa;">{{planName}}</strong>.</p>
    <p style="color: #d1d5db; line-height: 1.6;">Your new resources and features are now active. You can start using them immediately.</p>
    <div style="text-align: center; margin: 32px 0;">
      <a href="{{dashboardUrl}}" style="background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; padding: 14px 32px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; display: inline-block;">Go to Dashboard</a>
    </div>
    <p style="color: #6b7280; font-size: 13px; border-top: 1px solid #374151; padding-top: 16px; margin-top: 32px;">Thank you for upgrading. Enjoy your enhanced resources and capabilities.</p>
  </div>
</div>
