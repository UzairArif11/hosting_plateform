<div style="font-family: 'Segoe UI', Arial, sans-serif; max-width: 600px; margin: 0 auto; background: #0f0f23; color: #e5e7eb; border-radius: 16px; overflow: hidden;">
  <div style="background: linear-gradient(135deg, #d97706, #b45309); padding: 32px; text-align: center;">
    <h1 style="margin: 0; font-size: 24px; color: white;">{{platformName}}</h1>
  </div>
  <div style="padding: 32px;">
    <div style="background: #1c1917; border-left: 4px solid #f59e0b; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
      <h2 style="margin: 0 0 8px 0; color: #f59e0b; font-size: 20px;">⏰ Grace Period Reminder</h2>
    </div>
    <p style="color: #d1d5db; line-height: 1.6;">Hi <strong style="color: white;">{{userName}}</strong>,</p>
    <p style="color: #d1d5db; line-height: 1.6;">You have <strong style="color: #f59e0b;">{{daysLeft}} days</strong> left in your grace period. After that, your account will be suspended and your projects will be stopped.</p>
    <p style="color: #d1d5db; line-height: 1.6;">Your data will remain safe — renew anytime to bring everything back online instantly.</p>
    <div style="text-align: center; margin: 32px 0;">
      <a href="{{renewUrl}}" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 14px 32px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; display: inline-block;">Renew Now</a>
    </div>
  </div>
</div>
